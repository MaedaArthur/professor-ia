<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop de IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper:      #F6F3EC;
    --paper-up:   #FBF9F4;
    --ink:        #1B1A17;
    --ink-soft:   #6E6657;
    --ink-faint:  #B5AE9E;
    --rule:       #D8D2C4;
    --rule-soft:  #E3DED2;
    --accent:     #9C3B28;
    --accent-dim: #C9A295;
    --dark:       #1C1B18;
    --dark-text:  #EDE8DC;
    --dark-mute:  #9A9484;
    --dark-key:   #9FC8E8;
    --dark-str:   #C9DC9B;
    --dark-fn:    #E3C98C;

    --sans: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --pad-x: 80px;
    --pad-t: 60px;
    --pad-b: 44px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: #E8E4DA;
    font-family: var(--sans);
    color: var(--ink);
    overflow: hidden;
  }

  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }

  #stage {
    position: relative;
    width: 1280px; height: 720px;
    background: var(--paper);
    transform-origin: center center;
    overflow: hidden;
  }

  /* ───────── cabeçalho e trilha ───────── */

  #head {
    position: absolute; left: var(--pad-x); right: var(--pad-x); top: var(--pad-t);
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--rule); padding-bottom: 12px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.1em;
    color: var(--ink-soft);
    transition: opacity .3s ease;
  }

  #track {
    position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: var(--pad-b);
    border-top: 1px solid #C9C2B2; padding-top: 13px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.07em;
    color: var(--ink-soft);
  }
  #stations {
    display: flex; flex-grow: 1; justify-content: space-between;
    padding-right: 40px; transition: opacity .34s ease;
  }
  #stations.off { opacity: 0; }
  .station {
    position: relative; flex: 0 0 auto; white-space: nowrap;
    transition: color .34s ease;
  }
  .station::before {
    content: ""; position: absolute; left: 0; top: -17px;
    width: 1px; height: 7px; background: #C9C2B2;
    transition: background .34s ease, width .34s ease;
  }
  .station.on { color: var(--accent); font-weight: 600; }
  .station.on::before { background: var(--accent); width: 2px; }

  .bare #head, .bare #track { opacity: 0; }

  /* ───────── o mascote ───────── */

  #mascot {
    position: absolute; left: 0; top: 0; width: 100px; height: 100px;
    margin-left: -50px; margin-top: -50px;
    pointer-events: none;
    transform: translate(var(--mx, 200px), var(--my, 619px)) scale(var(--ms, 0.58));
    transition: transform .46s cubic-bezier(.46,.03,.34,1), opacity .3s ease;
    z-index: 5;
  }
  #mascot.hidden { opacity: 0; }
  #arc { transform: translateY(0); }
  #mascot.travelling #arc { animation: arc .46s cubic-bezier(.46,.03,.34,1); }

  /* Parado ele respira: embalo lento e torção mínima. Só fora da viagem,
     senão as duas animações disputam o mesmo transform. */
  #mascot.vagando:not(.travelling) #arc { animation: respiro 7s ease-in-out infinite; }
  @keyframes respiro {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    40%      { transform: translateY(-3px) rotate(-1.5deg); }
    70%      { transform: translateY(1px) rotate(1deg); }
  }
  @keyframes arc {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-38px); }
    100% { transform: translateY(0); }
  }
  #mascot svg { display: block; width: 100px; height: 100px; overflow: visible; }

  #tanglePath {
    fill: none; stroke: var(--ink); stroke-width: 3.2;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .34s ease;
  }
  .eye { fill: var(--ink); transition: fill .34s ease, opacity .13s ease; }
  #mascot.balled .eye { opacity: 0; }
  #mascot.hot #tanglePath { stroke: var(--accent); }
  #mascot.hot .eye { fill: var(--accent); }

  /* ───────── corpo ───────── */

  #slide {
    position: absolute; left: var(--pad-x); right: var(--pad-x);
    top: 118px; bottom: 104px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .bare #slide { top: var(--pad-t); bottom: var(--pad-b); }

  h1 {
    margin: 0; font-size: 54px; line-height: 1.16; font-weight: 700;
    letter-spacing: -0.022em; max-width: 960px;
  }
  h1 .soft { font-weight: 400; color: var(--ink); display: block; margin-bottom: 24px; font-size: 42px; }
  h1 .hot { color: var(--accent); }

  h2 { margin: 0 0 24px; font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.018em; }
  h2.tight { margin-bottom: 0; }

  p.lede { margin: 0; font-size: 22px; line-height: 1.5; color: var(--ink-soft); max-width: 820px; }
  p.lede b, blockquote b, h1 b { color: var(--ink); font-weight: 600; }

  blockquote {
    margin: 0; border-left: 3px solid var(--accent); padding-left: 20px;
    font-size: 27px; line-height: 1.38; font-weight: 500; max-width: 920px;
  }
  blockquote b { color: var(--accent); font-weight: 700; }

  code { font-family: var(--mono); font-size: 0.9em; }

  pre {
    flex-shrink: 0;   /* item flex encolhe calado e o overflow:hidden corta o código */
    margin: 0; background: var(--dark); border-radius: 3px;
    padding: 26px 30px; font-family: var(--mono); font-size: 17px;
    line-height: 1.72; color: var(--dark-text); overflow: hidden; tab-size: 2;
  }
  pre.sm  { font-size: 15px;   line-height: 1.66; padding: 22px 26px; }
  pre.xs  { font-size: 13px;   line-height: 1.62; padding: 20px 24px; }
  pre.xxs { font-size: 11.5px; line-height: 1.58; padding: 18px 22px; }
  pre .k { color: var(--dark-key); }
  pre .s { color: var(--dark-str); }
  pre .f { color: var(--dark-fn); }
  pre .p { color: var(--dark-mute); }
  pre .c { color: var(--dark-mute); font-style: italic; }
  pre .hl { background: rgba(156,59,40,.28); border-radius: 2px; padding: 1px 3px; margin: 0 -3px; }
  pre .cap {
    display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dark-mute); margin-bottom: 15px;
  }

  .step { opacity: 0; transform: translateY(7px); transition: opacity .3s ease, transform .3s ease; }
  .step.in { opacity: 1; transform: none; }

  /* capa */
  .capa { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 8px 0 4px; }
  .capa h1 { font-size: 86px; line-height: 1.02; max-width: 1000px; }
  .capa .meta { font-family: var(--mono); font-size: 15px; color: var(--ink-soft); letter-spacing: 0.08em; }

  /* título de seção */
  .titulo { display: flex; align-items: baseline; gap: 30px; }
  .titulo .num {
    font-family: var(--mono); font-size: 20px; color: var(--accent);
    letter-spacing: 0.1em; padding-top: 10px; white-space: nowrap;
  }
  .titulo h1 { font-size: 64px; }

  /* medição */
  .medicao { text-align: center; }
  .medicao .big {
    font-family: var(--mono); font-size: 148px; line-height: 1; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .medicao .big.hot { color: var(--accent); }
  .medicao .cap { font-size: 24px; color: var(--ink-soft); margin-top: 18px; }

  /* comparação */
  .cmp { display: flex; gap: 32px; align-items: stretch; }
  .cmp .col {
    flex: 1 1 0; min-width: 0; border: 1px solid var(--rule); background: var(--paper-up);
    padding: 26px 28px; display: flex; flex-direction: column; gap: 14px;
  }
  .cmp .col.mark { border-color: var(--accent); border-width: 1px 1px 1px 3px; }
  .cmp .col h3 {
    margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em;
  }
  .cmp .col.mark h3 { color: var(--accent); }
  .cmp .col .line { font-size: 19px; line-height: 1.42; color: var(--ink-soft); display: flex; gap: 12px; }
  .cmp .col .line::before { content: "\00B7"; color: var(--ink-faint); flex: 0 0 auto; }
  .cmp .col .line b { color: var(--ink); font-weight: 600; }

  /* progressão */
  .prog { display: flex; gap: 72px; align-items: center; }
  .prog-rows {
    flex: 0 0 566px; font-family: var(--mono); font-size: 25px;
    font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 13px;
  }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .row .lbl { white-space: nowrap; }
  .row .lead { flex-grow: 1; min-width: 44px; border-bottom: 1px dotted var(--ink-faint); transform: translateY(-6px); }
  .row .val { width: 92px; text-align: right; }
  .row.hot { color: var(--accent); font-weight: 600; }
  .row.hot .lead { border-color: var(--accent-dim); }
  .prog-note { font-family: var(--sans); margin: 24px 0 0; font-size: 23px; font-weight: 500; letter-spacing: -0.012em; }
  .prog-stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mascot-slot { width: 240px; height: 240px; }
  .prog-cap { font-family: var(--mono); font-size: 14px; color: var(--ink-soft); text-align: center; }

  /* código lado a lado */
  .split { display: flex; gap: 48px; align-items: center; }
  .split .left { flex: 0 0 332px; display: flex; flex-direction: column; gap: 18px; }
  .split .right { flex-grow: 1; min-width: 0; }

  /* ao vivo */
  .aovivo { display: flex; flex-direction: column; gap: 26px; }
  .aovivo .flag {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); display: flex; align-items: center; gap: 16px;
  }
  .aovivo .flag::after { content: ""; flex-grow: 1; height: 2px; background: var(--accent); }
  .aovivo h1 { font-size: 46px; }

  /* prática */
  .pratica { display: flex; gap: 34px; align-items: flex-start; }
  .pratica .idx {
    font-family: var(--mono); font-size: 19px; color: var(--accent);
    letter-spacing: 0.1em; padding-top: 12px; white-space: nowrap;
  }
  .pratica .body { display: flex; flex-direction: column; gap: 18px; }
  .pratica h2 { margin: 0; font-size: 40px; }

  /* as quatro peças, como diagrama */
  .pecas { display: flex; flex-direction: column; }
  .pecas .fila { display: flex; gap: 18px; }
  .pecas .card {
    flex: 1 1 0; min-width: 0;
    border: 1px solid var(--rule); background: var(--paper-up);
    padding: 22px 24px; display: flex; flex-direction: column; gap: 9px;
    transition: border-color .3s ease, opacity .3s ease;
  }
  .pecas .card.off { opacity: .42; }
  .pecas .card.on { border-color: var(--accent); border-left-width: 3px; padding-left: 22px; }
  .pecas .num {
    font-family: var(--mono); font-size: 12px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .pecas .card.on .num, .pecas .volta.on .num { color: var(--accent); }
  .pecas .nome { font-size: 25px; font-weight: 700; letter-spacing: -.015em; line-height: 1.1; }
  .pecas .card.on .nome, .pecas .volta.on .nome { color: var(--accent); }
  .pecas .desc { font-size: 16px; line-height: 1.38; color: var(--ink-soft); }

  .pecas .volta {
    display: flex; align-items: center; gap: 14px;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--rule);
    transition: opacity .3s ease;
  }
  .pecas .volta.off { opacity: .42; }
  .pecas .volta .nome { font-size: 22px; }
  .pecas .volta .desc { white-space: nowrap; }
  .pecas .seta { flex-grow: 1; position: relative; height: 1px; background: var(--ink-faint); }
  .pecas .volta.on .seta { background: var(--accent); }
  .pecas .seta::before {
    /* sem border-left: ela é transparente mas ocupa espaço, e empurrava a
       ponta para longe do corpo da linha */
    content: ""; position: absolute; left: 0; top: -3.5px;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-right: 7px solid var(--ink-faint);
  }
  .pecas .volta.on .seta::before { border-right-color: var(--accent); }

  /* apresentação do nó */
  .nofig { display: flex; gap: 56px; align-items: center; }
  .nofig .texto { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .nofig .mascot-slot { flex: 0 0 300px; height: 300px; }
  .nota {
    margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.5;
    color: var(--ink-faint); border-top: 1px solid var(--rule-soft);
    padding-top: 12px; margin-top: 8px;
  }

  /* quem sou */
  .quem { display: flex; gap: 56px; align-items: center; }
  .quem .foto {
    flex: 0 0 334px; height: 334px; position: relative;
    border: 1px solid var(--rule); background: var(--paper-up);
    overflow: hidden; border-radius: 50%;
  }
  .quem .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .quem .foto .vazio {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center;
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em;
  }
  .quem .lado { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .quem .subrow { display: flex; gap: 20px; align-items: flex-start; }
  .quem .subfig { flex: 0 0 auto; order: -1; width: 54px; margin-top: 2px; }
  .quem .subfig.step { transform: none; }
  .quem .subfig svg { display: block; width: 54px; height: 92px; }

  /* A entrada e o balanço são os do próprio Subzinho, em
     front/src/styles/index.css do ai-core: grant-subzinho e subzinho-swing.
     O pino do balanço é 38 8, o nó do cordão. */
  .quem .subfig.in .subpulo { animation: grant-subzinho 620ms cubic-bezier(.16, 1, .3, 1) both; }
  .quem .subfig .subswing { transform-box: view-box; transform-origin: 38px 8px; }
  .quem .subfig.in .subswing { animation: subzinho-swing 9s linear 700ms infinite; }

  @keyframes grant-subzinho {
    0%   { transform: translateY(26px) scale(.82); opacity: 0; }
    55%  { transform: translateY(-6px) scale(1.04); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes subzinho-swing {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(2.8deg); }
    25%  { transform: rotate(3deg); }
    35%  { transform: rotate(2.8deg); }
    50%  { transform: rotate(0deg); }
    65%  { transform: rotate(-2.8deg); }
    75%  { transform: rotate(-3deg); }
    85%  { transform: rotate(-2.8deg); }
    100% { transform: rotate(0deg); }
  }
  .quem h1 { font-size: 56px; }
  .quem .cargo {
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent);
  }

  /* leva */
  .leva { border: 1px solid var(--rule); background: var(--paper-up); padding: 32px 38px; display: flex; flex-direction: column; gap: 20px; }
  .leva .flag {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
  }

  #hint {
    position: fixed; right: 14px; bottom: 12px;
    font-family: var(--mono); font-size: 11px; color: #9A9281; letter-spacing: 0.06em;
  }

  @page { size: 1280px 720px; margin: 0; }
  @media print {
    html, body { overflow: visible; background: #fff; height: auto; }
    #viewport { position: static; display: block; }
    #hint { display: none; }
    #stage { page-break-after: always; break-after: page; }
  }
  body.printing { overflow: auto; }
  body.printing #viewport { position: static; display: block; padding: 24px 0; }
  body.printing #stage { margin: 0 auto 24px; }
</style>
</head>
<body>

<div id="viewport"><div id="stage">
  <div id="head"><span id="head-l"></span><span id="head-r"></span></div>
  <div id="slide"></div>
  <div id="track">
    <div id="stations">
      <span class="station" data-piece="prompt">prompt</span>
      <span class="station" data-piece="memoria">memória</span>
      <span class="station" data-piece="ferramentas">ferramentas</span>
      <span class="station" data-piece="loop">loop</span>
    </div>
    <span id="pageno"></span>
  </div>
  <div id="mascot"><div id="arc">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="tangle">
        <path id="tanglePath"></path>
        <circle class="eye" cx="43" cy="46" r="3.1"></circle>
        <circle class="eye" cx="57" cy="46" r="3.1"></circle>
      </g>
    </svg>
  </div></div>
</div></div>

<div id="hint">← → navega · p imprime tudo · r recomeça</div>

<script id="source" type="text/x-slides">
@type: capa
@n: 1
@topo: workshop · 135 minutos
@rodape: Arthur Maeda · UFSC
# Inteligência artificial
::lede:: Todo mundo nesta sala já usa. Hoje você vai ver o que acontece quando aperta enter, e sai com uma construída por você.

===
@type: quemsou
@n: 2
@foto: retrato.png
@cargo: quem está falando
# Arthur Maeda
::lede:: Engenharia Elétrica na UFSC, monitor de Eletrônica. Me formo em 2029, então estou do mesmo lado da sala que você.
::lede:: Diretor de Operações na VendeAI, um SaaS nativo de IA. Em julho de 2026 o produto originou mais de R$ 1 bilhão em crédito.
::subzinho:: Lá eu construí o <b>Subzinho</b>, um agente que configura a conta do parceiro sozinho. São 45 ferramentas sob mais de 900 testes.
::quote:: Ah, e mais uma coisa: <b>estes slides foram construídos com IA</b>. No fim eu mostro o arquivo que fez isso acontecer.

===
@type: mascote
@n: 3
@tema: motivação
## Falta apresentar mais um
::lede:: Este é o <b>Nozinho</b>, o mascote da aula. Ele mora ali embaixo, no índice dos assuntos que acabou de aparecer, e anda comigo conforme a gente avança.
::lede:: Repare nele ao longo da aula: <b>quanto mais contexto a gente empilha para a IA, mais embolado ele fica</b>.
::lede:: Ele começa frouxo. Repare nele.

===
@type: titulo
@n: 4
@tema: motivação
@num: a pergunta do dia
# Por que a IA te explica tudo e você não aprende nada?
::lede:: Duas pessoas nesta sala têm o mesmo problema, em roupas diferentes.

===
@type: comparacao
@n: 5
@tema: motivação
## Duas dores, o mesmo defeito
::esq:: Quem estuda com IA | pede "me explica todo o conteúdo" | recebe duas mil palavras | lê tudo e <b>não absorve nada</b>
::dir:: Quem programa com IA | abre o Claude e manda "faz aí" | não dá contexto, não pede plano, não lê o diff | tem a melhor ferramenta e usa <b>20% dela</b>
::quote:: Nos dois casos a ferramenta é boa. O <b>uso</b> é que está errado.

===
@type: pergunta
@n: 6
@tema: motivação
@soft: A IA é generosa demais. Ela te dá tudo, e dar tudo não é ensinar.
# E se ela fosse proibida de te dar a resposta?

===
@type: mecanismo
@n: 7
@tema: motivação
## O professor de IA
::lede:: Um chat de terminal que estuda <b>com</b> você, a partir do material da sua matéria. Ele conhece o conteúdo, conhece o seu nível, e se recusa a entregar resposta pronta.
```txt
você    "resolve o exercício 2 pra mim"
ele     "esse eu não resolvo. Mas resolvo junto:
         o exercício pede o total de tokens de entrada.
         O que exatamente vai dentro de cada requisição?"
```
::quote:: Ele não é mais inteligente que o Claude. Ele é <b>mais teimoso</b>.

===
@type: mecanismo
@n: 8
@tema: motivação
## Por que construir esse, e não outra coisa
::lede:: Porque ele é pequeno o bastante para caber em 135 minutos e completo o bastante para ter as quatro peças de qualquer agente sério: um prompt, uma memória, ferramentas e um loop.
::quote:: Quando você terminar o professor, você terminou de entender o <b>Claude Code</b> também. É a mesma máquina, com outro texto dentro.

===
@type: titulo
@n: 9
@tema: demonstração
@num: vamos ver
# Mesmo modelo. Instruções diferentes.
::lede:: À esquerda, uma IA genérica. À direita, o professor. Quatro perguntas em cada um.

===
@type: comparacao
@n: 10
@tema: demonstração
## 1 · "o que é um LLM?"
::esq:: IA genérica | responde bem | explicação completa e correta | provavelmente <b>melhor</b> que a daqui
::dir:: O professor | responde bem | começa perguntando o que você já sabe | uma ideia por vez
::quote:: Nesta pergunta o genérico ganha. Não pare aqui.

@type: mecanismo

## O que é uma API
::lede:: É um endereço na internet que aceita pedidos de um programa, não de uma pessoa. Você não abre no navegador: o seu código manda um pacote de dados e recebe outro de volta.
```txt
o seu código  ->  https://...../chat/completions  ->  o modelo
              <-  resposta em JSON               <-
```
::quote:: O modelo roda no servidor de alguém. Você nunca toca nele: você conversa com o <b>endereço</b>.

===
@type: comparacao
@n: 31
@tema: o modelo
## GET e POST
::esq:: GET | "me dá isso aí" | o pedido vai na própria URL | é o que o navegador faz quando você abre um site
::dir:: POST | "toma, processa isso" | leva um pacote de dados junto | é o que a gente usa, porque a pergunta não cabe numa URL
::quote:: Falar com um modelo é um <b>POST</b>. Só isso.

===
@type: mecanismo
@n: 32
@tema: o modelo
## SDK e framework, e por que não vamos usar
::lede:: SDK é uma biblioteca que o fornecedor te dá para esconder o POST. Framework é uma camada maior ainda, que esconde o SDK. Os dois são úteis no trabalho e péssimos para aprender.
```txt
com framework   agente.perguntar("oi")      e nada é visível
com SDK         cliente.chat.create(...)    quase nada é visível
cru             requests.post(url, json=...)  tudo é visível
```
::quote:: Hoje a gente vai no <b>cru</b>. Depois que você viu o POST, qualquer SDK fica óbvio.

===
@type: codigo

## Um token é um pedaço
```txt
"workshop"        ->  1 token
"inteligência"    ->  3 tokens
"      "          ->  1 token
"não"             ->  2 tokens
```
::step:: Palavra comum em inglês tende a ser 1 token. Português e acento custam mais. É por isso que a mesma frase custa diferente em cada idioma.

===
@type: mecanismo
@n: 38
@tema: o modelo
## O modelo só faz uma coisa
::lede:: Dado tudo o que veio antes, ele estima qual é o próximo token mais provável. Escolhe um. Põe no fim. E repete.
```txt
"O gato subiu no"  ->  telhado · sofá · muro · ...
```
::quote:: Não existe plano, não existe rascunho. A frase inteira é construída <b>um token por vez</b>.

===
@type: mecanismo
@n: 39
@tema: o modelo
## Temperatura é o quanto ele arrisca
::lede:: Temperatura baixa pega quase sempre o token mais provável. Alta dá chance aos menos prováveis.
```txt
temperatura 0.0   ->  sempre "telhado"
temperatura 0.4   ->  quase sempre "telhado"
temperatura 1.2   ->  "sofá", "muro", às vezes besteira
```
::quote:: O professor desta matéria roda em <b>0.4</b>. Ensinar não é hora de inventar.

      var tl = s.blocks.filter(function (b) { return b.kind === 'lede'; })[0];
      return '<div class="titulo"><div class="num">' + (s.meta.num || '') + '</div><div><h1>' + (th ? th.text : '') + '</h1>' +
             (tl ? '<p class="lede" style="margin-top:22px">' + tl.text + '</p>' : '') + '</div></div>';
    }

    if (s.type === 'medicao') {
      var bg = s.blocks.filter(function (b) { return b.kind === 'big'; })[0];
      var cp = s.blocks.filter(function (b) { return b.kind === 'lede'; })[0];
      return '<div class="medicao"><div class="big' + (s.meta.hot ? ' hot' : '') + '">' + (bg ? bg.text : '') + '</div>' +
             (cp ? '<div class="cap">' + cp.text + '</div>' : '') + '</div>';
    }

    if (s.type === 'comparacao') {
      var hh = s.blocks.filter(function (b) { return b.kind === 'h2'; })[0];
      h += hh ? '<h2>' + hh.text + '</h2>' : '';
      h += '<div class="cmp">';
      s.cols.forEach(function (c) {
        h += '<div class="col' + (c.side === 'dir' ? ' mark' : '') + '"><h3>' + c.title + '</h3>';
        c.lines.forEach(function (ln) { h += '<div class="line"><span>' + ln + '</span></div>'; });
        h += '</div>';
      });
      h += '</div>';
      var cq = s.blocks.filter(function (b) { return b.kind === 'quote'; });
      cq.forEach(function (b, j) { h += '<blockquote class="step" data-i="' + j + '" style="margin-top:30px">' + b.text + '</blockquote>'; });
      return h;
    }

    if (s.type === 'progressao') {
      h += '<div class="prog"><div>';
      if (s.meta.setup) h += '<p style="margin:0 0 22px;font-family:var(--mono);font-size:14px;color:var(--ink-soft)">' + s.meta.setup + '</p>';
      h += '<div class="prog-rows">';
      s.rows.forEach(function (r, j) {
        if (r.kind === 'row') {
          h += '<div class="row step' + (r.hot ? ' hot' : '') + '" data-i="' + j + '"><span class="lbl">' + r.label +
               '</span><span class="lead"></span><span class="val">' + r.value + '</span></div>';
        } else {
          h += '<div class="prog-note step" data-i="' + j + '">' + r.text + '</div>';
        }
      });
      h += '</div></div><div class="prog-stage"><div class="mascot-slot"></div><div class="prog-cap" id="progcap"></div></div></div>';
      return h;
    }

    if (s.type === 'aovivo') {
      var ah = s.blocks.filter(function (b) { return b.kind === 'h1'; })[0];
      h += '<div class="aovivo"><div class="flag">' + (s.meta.quem === 'voce' ? 'mão na massa' : 'ao vivo') + '</div>';
      h += ah ? '<h1>' + ah.text + '</h1>' : '';
      var stepIdx = 0;
      s.blocks.forEach(function (b) {
        if (b.kind === 'lede')  h += '<p class="lede">' + b.text + '</p>';
        if (b.kind === 'code')  h += '<pre' + preClass(b.code, false) + '>' + highlight(b.code.join('\n'), b.lang) + '</pre>';
        if (b.kind === 'quote') h += '<blockquote class="step" data-i="' + (stepIdx++) + '">' + b.text + '</blockquote>';
        if (b.kind === 'step')  h += '<p class="lede step" data-i="' + (stepIdx++) + '">' + b.text + '</p>';
      });
      return h + '</div>';
    }

    if (s.type === 'pecas') {
      var acesas = (s.meta.acende || 'todas').split(',').map(function (x) { return x.trim(); });
      function liga(k) { return acesas[0] === 'todas' || acesas.indexOf(k) >= 0; }
      var CARDS = [
        ['prompt',      'quem ele é', 'texto que você escreve, e as permissões que ele tem'],
        ['memória',     'o que ele lembra', 'a lista de mensagens que você reenvia inteira, todo turno'],
        ['ferramentas', 'o que ele alcança', 'funções suas que ele pode pedir, mas nunca executar']
      ];
      var hh = s.blocks.filter(function (b) { return b.kind === 'h2'; })[0];
      var ll = s.blocks.filter(function (b) { return b.kind === 'lede'; })[0];
      h += hh ? '<h2>' + hh.text + '</h2>' : '';
      h += ll ? '<p class="lede" style="margin-bottom:26px">' + ll.text + '</p>' : '';
      h += '<div class="pecas"><div class="fila">';
      CARDS.forEach(function (c, j) {
        var chave = j === 1 ? 'memoria' : c[0];
        h += '<div class="card ' + (liga(chave) ? 'on' : 'off') + '">' +
             '<div class="num">peça ' + (j + 1) + '</div>' +
             '<div class="nome">' + c[0] + '</div>' +
             '<div class="desc"><b>' + c[1] + '</b><br>' + c[2] + '</div></div>';
      });
      h += '</div><div class="volta ' + (liga('loop') ? 'on' : 'off') + '">' +
           '<span class="num">peça 4</span><span class="nome">loop</span>' +
           '<span class="desc">repete as três até ele parar de pedir ferramenta</span>' +
           '<span class="seta"></span></div></div>';
      var qq = s.blocks.filter(function (b) { return b.kind === 'quote'; });
      qq.forEach(function (b, j) {
        h += '<blockquote class="step" data-i="' + j + '" style="margin-top:28px">' + b.text + '</blockquote>';
      });
      return h;
    }

    if (s.type === 'mascote') {
      var mh = s.blocks.filter(function (b) { return b.kind === 'h2'; })[0];
      h += '<div class="nofig"><div class="texto">';
      h += mh ? '<h2 style="margin:0">' + mh.text + '</h2>' : '';
      var mi = 0;
      s.blocks.forEach(function (b) {
        if (b.kind === 'lede')  h += '<p class="lede step" data-i="' + (mi++) + '">' + b.text + '</p>';
        if (b.kind === 'quote') h += '<blockquote class="step" data-i="' + (mi++) + '">' + b.text + '</blockquote>';
        if (b.kind === 'nota')  h += '<p class="nota">' + b.text + '</p>';
      });
      return h + '</div><div class="mascot-slot"></div></div>';
    }

    if (s.type === 'quemsou') {
      var qh = s.blocks.filter(function (b) { return b.kind === 'h1'; })[0];
      var foto = s.meta.foto || '';
      h += '<div class="quem"><div class="foto">';
      h += '<div class="vazio"><span>' + (foto || 'retrato.jpg') + '</span><span>ponha o arquivo ao lado do deck</span></div>';
      if (foto) h += '<img src="' + foto + '" alt="" onerror="this.remove()">';
      h += '</div><div class="lado">';
      h += s.meta.cargo ? '<div class="cargo">' + s.meta.cargo + '</div>' : '';
      h += qh ? '<h1>' + qh.text + '</h1>' : '';
      var qi = 0;
      s.blocks.forEach(function (b) {
        if (b.kind === 'lede')  h += '<p class="lede step" data-i="' + (qi++) + '">' + b.text + '</p>';
        if (b.kind === 'sub')   h += '<div class="subrow">' +
                                     '<p class="lede step" data-i="' + (qi++) + '" style="margin:0">' + b.text + '</p>' +
                                     '<div class="subfig step" data-i="' + (qi++) + '">' + SUBZINHO + '</div></div>';
        if (b.kind === 'quote') h += '<blockquote class="step" data-i="' + (qi++) + '">' + b.text + '</blockquote>';
        if (b.kind === 'step')  h += '<p class="lede step" data-i="' + (qi++) + '">' + b.text + '</p>';
      });
      return h + '</div></div>';
    }

    if (s.type === 'pratica') {
      var ph = s.blocks.filter(function (b) { return b.kind === 'h2'; })[0];
      h += '<div class="pratica"><div class="idx">' + (s.meta.num || '') + '</div><div class="body">';
      h += ph ? '<h2>' + ph.text + '</h2>' : '';
      var pi = 0;
      s.blocks.forEach(function (b) {
        if (b.kind === 'lede')  h += '<p class="lede">' + b.text + '</p>';
        if (b.kind === 'code')  h += '<pre' + preClass(b.code, false) + '>' + highlight(b.code.join('\n'), b.lang) + '</pre>';
        if (b.kind === 'quote') h += '<blockquote class="step" data-i="' + (pi++) + '">' + b.text + '</blockquote>';
        if (b.kind === 'step')  h += '<p class="lede step" data-i="' + (pi++) + '">' + b.text + '</p>';
      });
      return h + '</div></div>';
    }

    if (s.type === 'leva') {
      h += '<div class="leva"><div class="flag">o que você leva daqui</div>';
      var li = 0;
      s.blocks.forEach(function (b) {
        if (b.kind === 'h2')    h += '<h2 class="tight">' + b.text + '</h2>';
        if (b.kind === 'lede')  h += '<p class="lede">' + b.text + '</p>';
        if (b.kind === 'code')  h += '<pre' + preClass(b.code, false) + '>' + highlight(b.code.join('\n'), b.lang) + '</pre>';
        if (b.kind === 'quote') h += '<blockquote class="step" data-i="' + (li++) + '">' + b.text + '</blockquote>';
        if (b.kind === 'step')  h += '<p class="lede step" data-i="' + (li++) + '">' + b.text + '</p>';
      });
      return h + '</div>';
    }

    var codes = s.blocks.filter(function (b) { return b.kind === 'code'; });

    if ((s.type === 'codigo' || s.type === 'terminal') && codes.length && s.meta.lado !== 'nao') {
      h += '<div class="split"><div class="left">';
      s.blocks.forEach(function (b) {
        if (b.kind === 'h2')   h += '<h2 style="margin:0">' + b.text + '</h2>';
        if (b.kind === 'lede') h += '<p class="lede">' + b.text + '</p>';
      });
      h += '</div><div class="right">';
      codes.forEach(function (b) {
        h += '<pre' + preClass(b.code, true) + '>' +
             (s.meta.cap ? '<span class="cap">' + s.meta.cap + '</span>' : '') +
             highlight(b.code.join('\n'), b.lang) + '</pre>';
      });
      h += '</div></div>';
      var qq = s.blocks.filter(function (b) { return b.kind === 'quote' || b.kind === 'step'; });
      qq.forEach(function (b, j) {
        h += b.kind === 'quote'
          ? '<blockquote class="step" data-i="' + j + '" style="margin-top:32px">' + b.text + '</blockquote>'
          : '<p class="lede step" data-i="' + j + '" style="margin-top:28px">' + b.text + '</p>';
      });
      return h;
    }

    var k = 0;
    s.blocks.forEach(function (b) {
      if (b.kind === 'h1') {
        h += '<h1>' + (s.meta.soft ? '<span class="soft">' + s.meta.soft + '</span>' : '') +
             '<span class="hot">' + b.text + '</span></h1>';
      }
      else if (b.kind === 'h2')    h += '<h2>' + b.text + '</h2>';
      else if (b.kind === 'lede')  h += '<p class="lede" style="margin-bottom:24px">' + b.text + '</p>';
      else if (b.kind === 'code')  h += '<pre' + preClass(b.code, false) + '>' +
                                        (s.meta.cap ? '<span class="cap">' + s.meta.cap + '</span>' : '') +
                                        highlight(b.code.join('\n'), b.lang) + '</pre>';
      else if (b.kind === 'quote') h += '<blockquote class="step" data-i="' + (k++) + '" style="margin-top:30px">' + b.text + '</blockquote>';
      else if (b.kind === 'step')  h += '<p class="lede step" data-i="' + (k++) + '" style="margin-top:26px">' + b.text + '</p>';
    });
    return h;
  }

  /* O bloco escuro tem overflow hidden: linha comprida some sem avisar.
     Em vez de confiar no olho, escolhe o corpo pela linha mais longa. */
  function preClass(lines, narrow) {
    var max = 0;
    for (var i = 0; i < lines.length; i++) if (lines[i].length > max) max = lines[i].length;
    var cab = narrow ? 44 : 62;
    if (max > cab * 1.62 || lines.length > 15) return ' class="xxs"';
    if (max > cab * 1.30 || lines.length > 12) return ' class="xs"';
    if (max > cab        || lines.length > 7)  return ' class="sm"';
    return '';
  }

  function stepCount(s) {
    return s.type === 'progressao' ? s.rows.length : slideEl.querySelectorAll('.step').length;
  }

  /* ═══════════ mascote ═══════════
     A transição não troca de desenho: a órbita aperta até virar um nó de tinta,
     viaja, e abre de novo na densidade nova. Mesma fórmula o tempo todo. */

  var curLoops = 2.2, curK = 1, rafId = null, relogios = [];
  var TIGHT = 0.26;

  function drawMascot() { tanglePath.setAttribute('d', scribble(curLoops, curK)); }

  function easeIn(p)    { return p * p; }
  function easeOut(p)   { return 1 - Math.pow(1 - p, 3); }
  function easeInOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

  function tween(toLoops, toK, dur, ease, done) {
    if (rafId) cancelAnimationFrame(rafId);
    var fromL = curLoops, fromK = curK, t0 = null;
    function frame(now) {
      if (t0 === null) t0 = now;
      var p = Math.min(1, (now - t0) / dur), e = ease(p);
      curLoops = fromL + (toLoops - fromL) * e;
      curK = fromK + (toK - fromK) * e;
      drawMascot();
      if (p < 1) rafId = requestAnimationFrame(frame);
      else { rafId = null; if (done) done(); }
    }
    rafId = requestAnimationFrame(frame);
  }

  /* O mascote caminha sobre a própria linha do índice, no rodapé.
     A posição dele na linha NÃO é aleatória: é o progresso no deck. Ele anda da
     esquerda para a direita, um passo por assunto, e fica parado dentro de um
     mesmo assunto. Quando a peça acende, ele assume a estação dela. */
  function temaDoSlide(i) { return (SLIDES[i] && SLIDES[i].meta.tema) || ''; }

  /* só cai aqui se o slide não tiver nem peça nem assunto */
  function pousoLivre(i) { return { x: 150, y: 619 }; }

  /* A trilha tem dois modos. Antes das peças ela é o índice dos assuntos, e o
     nó flutua por ele. Quando a peça acende, ela vira o índice das peças. */
  function montarTrilha(sl) {
    var pecas = !!sl.piece;
    var itens = pecas
      ? [['prompt', PIECE.prompt[1]], ['memoria', PIECE.memoria[1]],
         ['ferramentas', PIECE.ferramentas[1]], ['loop', PIECE.loop[1]]]
      : TEMAS.map(function (t) { return [t, t]; });
    var ativo = pecas ? sl.piece : temaDoSlide(si);
    stationsEl.innerHTML = itens.map(function (it) {
      return '<span class="station' + (it[0] === ativo ? ' on' : '') +
             '" data-piece="' + it[0] + '">' + it[1] + '</span>';
    }).join('');
    stations = Array.prototype.slice.call(stationsEl.querySelectorAll('.station'));
    stationsEl.classList.toggle('off', !itens.length);
  }

  function stationCenter(piece) {
    var el = stations.filter(function (st) { return st.dataset.piece === piece; })[0];
    if (!el) return pousoLivre(si);
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect(), k = sr.width / 1280;
    return { x: (r.left - sr.left) / k + 26, y: 619 };
  }

  function targetOf(target) {
    var slot = slideEl.querySelector('.mascot-slot');
    if (target === 'stage' && slot) {
      var r = slot.getBoundingClientRect(), sr = stage.getBoundingClientRect(), k = sr.width / 1280;
      return { pos: { x: (r.left - sr.left) / k + slot.offsetWidth / 2,
                      y: (r.top - sr.top) / k + slot.offsetHeight / 2 }, scale: 2.1 };
    }
    return { pos: stationCenter(target), scale: 0.58 };
  }

  function placeMascot(target, loops, modo) {
    var t = targetOf(target);
    function move() {
      mascot.style.setProperty('--mx', t.pos.x + 'px');
      mascot.style.setProperty('--my', t.pos.y + 'px');
      mascot.style.setProperty('--ms', t.scale);
    }
    /* Uma viagem no ar deixava a classe `balled` pendurada quando o slide
       seguinte entrava em outro modo, e os olhos sumiam para sempre. Agora
       todo modo limpa o estado e cancela o que ficou de uma viagem anterior. */
    if (relogios.length) { relogios.forEach(clearTimeout); relogios = []; }
    mascot.classList.remove('balled');

    if (modo === 'imediato') {
      mascot.classList.remove('travelling');
      curLoops = loops; curK = 1; drawMascot(); move(); return;
    }
    /* mesmo lugar, só o nó mudou: aperta sem enovelar nem viajar */
    if (modo === 'so-voltas') {
      mascot.classList.remove('travelling');
      move(); tween(loops, 1, 520, easeInOut); return;
    }

    mascot.classList.add('balled');
    tween(curLoops, TIGHT, 160, easeIn, function () {
      mascot.classList.add('travelling');
      move();
      relogios.push(setTimeout(function () {
        mascot.classList.remove('balled');
        tween(loops, 1, 240, easeOut);
        relogios.push(setTimeout(function () { mascot.classList.remove('travelling'); }, 60));
      }, 380));
    });
  }

  /* dentro do slide ele não viaja: só engrossa ou desembaraça */
  function reshape(loops, hot) {
    mascot.classList.toggle('hot', !!hot);
    tween(loops, 1, 430, easeInOut);
  }

  /* ═══════════ navegação ═══════════ */

  var lastKey = null;

  function render(instant) {
    var s = SLIDES[si];
    slideEl.innerHTML = body(s);

    stage.classList.toggle('bare', !!BARE[s.type]);
    headL.textContent = s.piece ? '· ' + PIECE[s.piece][0] + ' ·  ' + PIECE[s.piece][1] : (s.meta.tema || '');
    headR.textContent = s.meta.dir || '';
    pageNo.textContent = s.n;
    montarTrilha(s);

    step = 0;
    applySteps();

    var onStage = s.type === 'progressao' || s.type === 'mascote';
    var vagando = !s.piece && !onStage;
    /* a chave só muda quando o assunto muda, então ele anda poucas vezes */
    var key = onStage ? 'stage' : (s.piece || 'tema:' + temaDoSlide(si));
    mascot.classList.toggle('hot', false);
    mascot.classList.toggle('vagando', vagando);
    mascot.classList.toggle('hidden', !!BARE[s.type]);
    /* O nó aperta slide a slide enquanto a gente só empilha contexto, e solta
       quando as quatro peças chegam: dali em diante você sabe administrá-lo. */
    /* O nó aperta enquanto a gente só empilha contexto, e vai soltando de
       pouco em pouco ao longo das quatro peças: a cada uma você entende mais
       um pedaço do custo, e ele afrouxa junto. */
    var voltas;
    if (s.meta.voltas) voltas = parseFloat(s.meta.voltas);
    else if (s.type === 'mascote') voltas = 2.8;
    else if (onStage) voltas = 1.3;
    else if (si < VIRADA) voltas = 1.5 + (si / VIRADA) * 2.3;
    else {
      /* da virada em diante ele solta: as boas práticas são onde a gente de
         fato aprende a segurar o contexto, não as peças. */
      var resto = Math.max(1, SLIDES.length - 1 - VIRADA);
      voltas = 3.8 - ((si - VIRADA) / resto) * 2.3;
    }
    var modo = instant ? 'imediato' : (key === lastKey ? 'so-voltas' : 'viagem');
    placeMascot(onStage ? 'stage' : (s.piece || temaDoSlide(si)), voltas, modo);
    lastKey = key;
  }

  function applySteps() {
    var s = SLIDES[si];
    Array.prototype.forEach.call(slideEl.querySelectorAll('.step'), function (el, i) {
      el.classList.toggle('in', i < step);
    });
    if (s.type === 'progressao') {
      var cap = document.getElementById('progcap'), cur = null;
      for (var i = 0; i < step && i < s.rows.length; i++) if (s.rows[i].kind === 'row') cur = s.rows[i];
      if (cur) { reshape(cur.loops, !!cur.hot); if (cap) cap.innerHTML = cur.label + ' · <b>' + cur.value + '</b> tokens'; }
      else { reshape(1.3, false); if (cap) cap.textContent = ''; }
    }
  }

  function syncHash() { history.replaceState(null, '', '#' + si + '.' + step); }

  function readHash() {
    var m = (location.hash || '').match(/^#(\d+)(?:\.(\d+))?$/);
    if (!m) return false;
    si = Math.min(SLIDES.length - 1, Math.max(0, parseInt(m[1], 10)));
    render(true);
    step = Math.min(stepCount(SLIDES[si]), parseInt(m[2] || '0', 10));
    applySteps();
    return true;
  }

  function next() {
    if (step < stepCount(SLIDES[si])) { step++; applySteps(); syncHash(); return; }
    if (si < SLIDES.length - 1) { si++; render(); syncHash(); }
  }
  function prev() {
    if (step > 0) { step--; applySteps(); syncHash(); return; }
    if (si > 0) { si--; render(); step = stepCount(SLIDES[si]); applySteps(); syncHash(); }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { si = 0; step = 0; render(true); syncHash(); }
    else if (e.key === 'r') { si = 0; step = 0; render(true); syncHash(); }
    else if (e.key === 'p') { printAll(); }
  });
  stage.addEventListener('click', next);

  function fit() { stage.style.transform = 'scale(' + Math.min(innerWidth / 1280, innerHeight / 720) + ')'; }
  addEventListener('resize', fit);

  function printAll() {
    document.body.classList.add('printing');
    var vp = document.getElementById('viewport'), html = '';
    SLIDES.forEach(function (s) {
      var tmp = document.createElement('div');
      tmp.innerHTML = body(s);
      Array.prototype.forEach.call(tmp.querySelectorAll('.step'), function (el) { el.classList.add('in'); });
      html += '<div id="stage" class="' + (BARE[s.type] ? 'bare' : '') + '" style="transform:none">' +
              '<div id="head"><span>' + (s.piece ? '· ' + PIECE[s.piece][0] + ' ·  ' + PIECE[s.piece][1] : (s.meta.tema || '')) +
              '</span><span>' + (s.meta.dir || '') + '</span></div>' +
              '<div id="slide">' + tmp.innerHTML + '</div>' +
              '<div id="track"><div id="stations" class="' + (s.piece ? '' : 'off') + '">' +
              stations.map(function (st) {
                return '<span class="station' + (st.dataset.piece === s.piece ? ' on' : '') + '">' + st.textContent + '</span>';
              }).join('') + '</div><span>' + s.n + '</span></div></div>';
    });
    vp.innerHTML = html;
    print();
    setTimeout(function () { location.reload(); }, 600);
  }

  fit();
  drawMascot();

  /* ?audit: percorre todos os slides e reporta os que estouram a altura.
     Serve para manter um deck longo honesto sem olhar slide por slide. */
  if (/[?&]audit/.test(location.search)) {
    setTimeout(function () {
      var bad = [];
      for (var i = 0; i < SLIDES.length; i++) {
        si = i; render(true);
        Array.prototype.forEach.call(slideEl.querySelectorAll('.step'), function (el) { el.classList.add('in'); });
        var over = slideEl.scrollHeight - slideEl.clientHeight;
        var wide = slideEl.scrollWidth - slideEl.clientWidth;
        var corte = 0;
        Array.prototype.forEach.call(slideEl.querySelectorAll('pre'), function (pre) {
          corte = Math.max(corte, pre.scrollWidth - pre.clientWidth, pre.scrollHeight - pre.clientHeight);
        });
        if (over > 2 || wide > 2 || corte > 2)
          bad.push((i + 1) + ':' + SLIDES[i].type + (over > 2 ? ':alt' + over : '') +
                   (wide > 2 ? ':larg' + wide : '') + (corte > 2 ? ':CODIGO-CORTADO' + corte : ''));
      }
      document.title = 'AUDIT ' + (bad.length ? bad.join(' | ') : 'OK') + ' [total ' + SLIDES.length + ']';
      document.body.setAttribute('data-audit', document.title);
    }, 900);
    return;
  }

  if (!readHash()) render(true);
  setTimeout(fit, 500);
})();
</script>
</body>
</html>
